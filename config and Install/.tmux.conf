unbind C-b
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g prefix C-space
bind C-space send-prefix

set-option -g history-limit 100000
set -g mode-keys vi
set -g mouse on

# start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# clipboard integration
set -g set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Space send -X begin-selection
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind ] paste-buffer

# split panes using = and -
bind = split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:Tc'
set -g pane-border-style fg=#44475a
set -g pane-active-border-style fg=#bd93f9
set -g message-style bg=#1e1e2e,fg=#00ffff

# status bar
set -g status on
set -g status-interval 2
set -g status-justify centre
set -g status-position bottom
set -g status-bg "#282a36"
set -g status-fg "#f8f8f2"
set -g status-style "bg=#282a36,fg=#f8f8f2"

set -g status-left "#[fg=#bd93f9]\ue0b6#[bg=#bd93f9,fg=#282a36,bold] #(whoami)@#(hostname) #[bg=#282a36,fg=#bd93f9,nobold]\ue0b4"
set -g status-left-length 50
set -g status-right "#[fg=#50fa7b]\ue0b6#[bg=#50fa7b,fg=#282a36,bold] %I:%M %p | %d %b %Y #[bg=#282a36,fg=#50fa7b,nobold]\ue0b4"
set -g status-right-length 50

setw -g window-status-format "#[fg=#6272a4,bg=#282a36]\ue0b6 #I:#W \ue0b4"
setw -g window-status-current-format "#[fg=#8be9fd,bg=#282a36]\ue0b6#[fg=#282a36,bg=#8be9fd,bold] #I:#W #[fg=#8be9fd,bg=#282a36,nobold]\ue0b4"
setw -g window-status-separator ""

set -g pane-border-style fg=#44475a
set -g pane-active-border-style fg=#bd93f9
set -g message-style bg=#44475a,fg=#f8f8f2
set -g message-command-style bg=#44475a,fg=#50fa7b
